<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Zlodeykapass</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Портфолио, прайсы и калькулятор стоимости.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <div class="hero-card">
                <div class="language-switch" role="group" aria-label="Language">
                    <button class="language-option is-active" type="button" data-language="ru" aria-pressed="true">Ru</button>
                    <button class="language-option" type="button" data-language="en" aria-pressed="false">Eng</button>
                </div>

                <div class="hero-title">
                    <img src="pfp1.jpg" alt="pfp left" class="pfp">
                    <div class="title-block">
                        <h1 id="artistName">диана злодейка</h1>
                    </div>
                    <img src="pfp2.jpg" alt="pfp right" class="pfp">
                </div>

                <div class="contacts">
                    <a class="button button-primary" href="https://t.me/zlodeyka_pass" target="_blank" rel="noopener noreferrer">Telegram</a>
                    <button class="button button-secondary" type="button" onclick="copyDiscord()">Discord</button>
                    <a class="button button-secondary" href="https://boosty.to/oasik" target="_blank" rel="noopener noreferrer">Boosty</a>
                    <a class="button button-secondary" href="https://www.artstation.com/sonnenfr4" target="_blank" rel="noopener noreferrer">ArtStation</a>
                </div>
            </div>
        </header>

        <main>
            <section class="section">
                <div class="section-heading">
                    <h2 id="galleryTitle">Галерея</h2>
                </div>

                <div class="gallery-card">
                    <button class="nav" type="button" aria-label="Предыдущее изображение">‹</button>

                    <div class="gallery-stage">
                        <img id="galleryImage" src="image1.jpg" alt="art">
                    </div>

                    <button class="nav" type="button" aria-label="Следующее изображение">›</button>
                </div>

                <div class="gallery-counter" id="galleryCounter">1 / 14</div>
            </section>

            <section class="section">
                <div class="section-heading">
                    <h2 id="calculatorTitle">Калькулятор стоимости</h2>
                </div>

                <div class="pricing-layout">
                    <div class="info-card visual-card">
                        <img src="moneyImage1.png" alt="price info" class="money-image">
                    </div>

                    <div class="info-card calculator-card">
                        <form class="calculator" onsubmit="return false;">
                            <div class="field">
                                <div class="field-label-row">
                                    <label for="format" id="formatLabel">Формат персонажа</label>
                                    <button class="help-trigger" type="button" data-help="format" aria-label="Пояснение к формату персонажа">?</button>
                                </div>
                                <select id="format"></select>
                            </div>

                            <div class="field">
                                <div class="field-label-row">
                                    <label for="extraCharacters" id="extraCharactersLabel">Доп. персонаж (+100%)</label>
                                    <button class="help-trigger" type="button" data-help="extraCharacters" aria-label="Пояснение к дополнительному персонажу">?</button>
                                </div>
                                <input type="number" id="extraCharacters" min="0" value="0">
                            </div>

                            <div class="field">
                                <div class="field-label-row">
                                    <label for="background" id="backgroundLabel">Фон</label>
                                    <button class="help-trigger" type="button" data-help="background" aria-label="Пояснение к фону">?</button>
                                </div>
                                <select id="background"></select>
                            </div>

                            <div class="field">
                                <div class="field-label-row">
                                    <label for="heavyDetails" id="heavyDetailsLabel">Доп. детали, крылья, броня и т. д. (+20%)</label>
                                    <button class="help-trigger" type="button" data-help="heavyDetails" aria-label="Пояснение к дополнительным деталям">?</button>
                                </div>
                                <input type="number" id="heavyDetails" min="0" value="0">
                            </div>

                            <div class="checks-grid">

                                <div class="check">
                                    <label class="check-content" for="nsfw">
                                        <input type="checkbox" id="nsfw">
                                        <span id="nsfwLabel">NSFW (+50%~)</span>
                                    </label>
                                    <button class="help-trigger" type="button" data-help="nsfw" aria-label="Пояснение к NSFW">?</button>
                                </div>

                                <div class="check">
                                    <label class="check-content" for="deadline">
                                        <input type="checkbox" id="deadline">
                                        <span id="deadlineLabel">Установление дедлайна (+25%)</span>
                                    </label>
                                    <button class="help-trigger" type="button" data-help="deadline" aria-label="Пояснение к установлению дедлайна">?</button>
                                </div>

                                <div class="check" id="discountRow">
                                    <label class="check-content" for="discount">
                                        <input type="checkbox" id="discount">
                                        <span id="discountLabel">Подписка на платку (скидка 20%)</span>
                                    </label>
                                    <button class="help-trigger" type="button" data-help="discount" aria-label="Пояснение к скидке по подписке">?</button>
                                </div>
                            </div>

                            <div class="total-card">
                                <span class="total-label" id="totalLabel">Итог</span>
                                <span class="total-value" id="totalValue">0 ₽</span>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

            <section class="section">
                <div class="section-heading">
                    <h2 id="importantTitle">Важно</h2>
                </div>

                <div class="info-card">
                    <ul class="info-list">
                        <li id="prepaymentText">Предоплата 100% после одобрения скетча</li>
                        <li><span id="animationText">Анимации - <strong>от 30$</strong> (цена за арт считается отдельно)</span><button class="help-trigger info-help" type="button" data-help="animation" aria-label="Примеры анимаций">?</button></li>
                        <li><span id="customsText">Кастомы - <strong>от 7000₽</strong></span><button class="help-trigger info-help" type="button" data-help="customs" aria-label="Пример кастома">?</button></li>
                        <li id="paymentText">Оплата: Boosty, Tribute, СБП</li>
                    </ul>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>© Zlodeykapass</p>
        </footer>
    </div>

    <div class="help-popover" id="helpPopover" role="tooltip" hidden>
        <div class="help-popover-content" id="helpPopoverContent"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
